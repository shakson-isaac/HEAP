      - Gtrans_raw
      - PXS_Alcohol
      - PXS_Deprivation_Indices
      - PXS_Diet_Weekly
      - PXS_Exercise_Freq
      - PXS_Exercise_MET
      - PXS_Internet_Usage
      - PXS_Residential_Air_Pollution
      - PXS_Residential_Noise_Pollution
      - PXS_Sexual_Factors
      - PXS_Sleep
      - PXS_Smoking
      - PXS_Sun_Exposure
      - PXS_Vitamins
    delta_sd_total: 1.0
    min_cases_per_disease: 100
    min_eid_overlap: 500
    disease_filter: all_available
    output_subdir: module3

  # ----------------------------------------------------------------
  # SUPPLEMENTARY EXPERIMENTS (single-layer adjustment sensitivities)
  # ----------------------------------------------------------------

