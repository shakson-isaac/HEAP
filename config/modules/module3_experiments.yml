      - PXS_Diet_Weekly
      - PXS_Exercise_Freq
      - PXS_Exercise_MET
      - PXS_Internet_Usage
      - PXS_Residential_Air_Pollution
      - PXS_Residential_Noise_Pollution
      - PXS_Sexual_Factors
      - PXS_Sleep
      - PXS_Smoking
      - PXS_Sun_Exposure
      - PXS_Vitamins
    delta_sd_total: 1.0
    min_cases_per_disease: 100
    min_eid_overlap: 500
    disease_filter: all_available
    output_subdir: module3

  M3_base_exclprev_lasso_partitioned:
    description: "Partitioned mediation, base adjustment on the healthy-at-baseline subset. A SAMPLE specification: covariate_set stays base and sample_filter does the work."
    priority: supplementary
    status: ready
    upstream_module1_experiment: M1_base_exclprev_lasso
    covariate_set: base
    sample_filter: exclude_prevalent
    family: lasso
    mediation_mode: partitioned_categories
    required_score_columns:
