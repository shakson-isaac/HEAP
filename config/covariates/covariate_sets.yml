# HEAP Covariate Set Definitions  (v2 — descriptive, base-primary)
# ============================================================
# Single source of truth for named covariate sets across all HEAP modules.
#
# DESIGN (2026-06-04 restructure):
#   - `base` is the PRIMARY adjustment used for ALL MAIN figures. It contains only
#     non-negotiable structural confounders (demographics, batch/site, ancestry)
#     that cannot be mediators of an exposure->protein effect.
#   - All other sets are SUPPLEMENTARY sensitivity layers built ON TOP of `base`,
#     each adding one potentially-mediating / optional adjustment so you can see
#     how estimates move. They are NOT the headline models.
#   - The old Type1..Type7 scheme is archived in covariate_sets_v1_archive.yml.
#     Names were changed (not redefined in place) so old Type* outputs stay valid.
#
# Migration of old sets:
#   Type3 -> base (NOTE: base drops BMI + fasting from old Type3, so base != Type3)
#   Type4 / Type5 -> base_clinical          Type6 -> base_ses
#   Type1 (age+sex), Type2 (no-PC metabolic), Type7 (meds->E) -> dropped
#
# Usage in R:
#   source("workflow/config_helpers.R")
#   covar <- load_covariate_set("base")          # -> character vector of names
#   disc  <- load_covariate_set_discrete("base") # factor-coercion list (pop_arch)
#   remap <- load_covariate_set_remapping("base_ses")  # E->C remap spec or NULL
#
# Notes:
#   - Every name must match a column in heap$covars_baseline (or, for base_ses, a
#     variable in the Deprivation_Indices exposure that is remapped into covariates).
#   - The `discrete` list drives factor coercion; `kernel_quantitative` is used by
#     population_architecture only.
#   - base_ses carries a `remapping` block: its deprivation variables live in the
#     Deprivation_Indices EXPOSURE and are moved into the covariate matrix at runtime
#     (e_to_covariate), so they are not double-counted as both exposure and covariate.
# ============================================================

